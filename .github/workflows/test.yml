name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install locked runtime and optional independent SMT checker
        working-directory: live_math_mcp_prod
        run: |
          python -m pip install --require-hashes -r requirements-019.lock
          python -m pip install 'z3-solver>=4.13,<6'
      - name: Unit and integration tests (no model calls)
        working-directory: live_math_mcp_prod
        env:
          PYTHONPATH: .:../src
        run: python -m pytest -q
