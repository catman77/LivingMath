name: Current package and assurance compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-package-313:
    name: Full package (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[white-star,test,mcp]'
      - run: python -m pytest -q tests
      - run: lm-suti doctor --smoke
  assurance-semantic-314:
    name: Assurance and Semantic compatibility (Python 3.14)
    runs-on: ubuntu-latest
    # Full numerical tests run above on 3.13. The pinned pandas 2.2.3 has no
    # cp314 wheel; this lane does not claim White Star compatibility on 3.14.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install '.[test,mcp]'
      - run: python -m pytest -q tests/test_release.py tests/test_semantic_bridge.py
      - run: lm-suti doctor --smoke
