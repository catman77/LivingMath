[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-pred-001"
version = "0.1.0"
description = "As-of-safe, data-gated Roblox prediction research pilot"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1",
  "duckdb>=1.4,<2", "pyarrow>=18,<30", "pandas>=2.2,<4",
  "numpy>=2,<3", "scikit-learn>=1.5,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "setuptools>=75", "wheel>=0.45"]
catboost = ["catboost>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
